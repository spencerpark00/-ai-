<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRO Copilot — 이동형 검사 로봇 HUD (실시간)</title>
<style>
  :root{--bg:#0a0e14;--panel:#131a24;--panel2:#1a2330;--line:#26313f;--line2:#334155;
    --txt:#e8eef5;--dim:#8a99ab;--dim2:#5f6f80;--acc:#22d3ee;--acc2:#2dd4bf;--ok:#4ade80;
    --warn:#fbbf24;--dang:#f87171;--robot:#a78bfa;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Pretendard','Malgun Gothic',sans-serif;font-size:14px;line-height:1.55}
  .device{max-width:1180px;margin:16px auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .top{display:flex;align-items:center;gap:14px;padding:13px 20px;background:linear-gradient(90deg,#0d1420,#131a24);border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--robot);box-shadow:0 0 10px var(--robot)}
  .logo small{color:var(--dim);font-weight:500;font-size:11px;margin-left:2px}
  .top .wo{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--dim)}
  .top .wo b{color:var(--txt);font-weight:600}
  .conn{font-size:11px;padding:3px 10px;border-radius:20px}
  .conn.on{background:rgba(74,222,128,.12);color:var(--ok);border:1px solid rgba(74,222,128,.3)}
  .conn.off{background:rgba(248,113,113,.12);color:var(--dang);border:1px solid rgba(248,113,113,.3)}
  .nav{display:flex;gap:8px;padding:10px 20px;background:var(--panel2);border-bottom:1px solid var(--line)}
  .nav a{font-size:12px;color:var(--dim);text-decoration:none;padding:5px 12px;border-radius:7px;border:1px solid transparent}
  .nav a.on{color:var(--robot);border-color:rgba(167,139,250,.3);background:rgba(167,139,250,.06)}
  .grid{display:grid;grid-template-columns:1.35fr 1fr}
  @media(max-width:920px){.grid{grid-template-columns:1fr}}
  .cam{position:relative;background:#05080d;min-height:460px;overflow:hidden;border-right:1px solid var(--line)}
  .cam-label{position:absolute;top:12px;left:14px;z-index:5;font-size:11px;color:var(--acc);font-family:monospace;background:rgba(0,0,0,.5);padding:4px 9px;border-radius:5px;display:flex;align-items:center;gap:7px}
  .rec{width:8px;height:8px;border-radius:50%;background:var(--dang);animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.3}}
  .skin-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.82) contrast(1.05) saturate(.9)}
  .cam-overlay{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 40% 45%,transparent 40%,rgba(5,8,13,.55) 100%);box-shadow:inset 0 0 90px rgba(5,8,13,.7)}
  .scanband{position:absolute;left:0;right:0;height:70px;z-index:3;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(34,211,238,.28),transparent);animation:scan 3.2s ease-in-out infinite}
  @keyframes scan{0%,100%{top:8%}50%{top:78%}}
  .bbox2{position:absolute;z-index:4;border:2px solid #fb923c;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 0 14px rgba(251,146,60,.4);animation:pulse 1.8s infinite}
  @keyframes pulse{50%{border-color:rgba(251,146,60,.45)}}
  .bbox-tag{position:absolute;top:-20px;left:-2px;font-family:monospace;font-size:10px;background:#fb923c;color:#0a0e14;padding:2px 7px;border-radius:4px;font-weight:700;white-space:nowrap}
  .cam-meta{position:absolute;bottom:12px;left:14px;right:14px;z-index:5;display:flex;justify-content:space-between;font-family:monospace;font-size:10.5px;color:var(--dim)}
  .cam-meta span{background:rgba(0,0,0,.5);padding:3px 8px;border-radius:5px}
  .cam-src{position:absolute;top:12px;right:14px;z-index:5;font-size:9.5px;color:var(--dim);background:rgba(0,0,0,.5);padding:3px 8px;border-radius:5px}
  .side{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card h3{font-size:11px;letter-spacing:.5px;color:var(--dim);text-transform:uppercase;font-weight:600;margin-bottom:11px;display:flex;align-items:center;gap:6px}
  .chat{display:flex;flex-direction:column;gap:9px}
  .msg{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.5}
  .msg .av{width:24px;height:24px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px}
  .msg.tech .av{background:rgba(74,222,128,.15)}.msg.ai .av{background:rgba(34,211,238,.15)}
  .msg .bub{padding:7px 11px;border-radius:9px;max-width:100%}
  .msg.tech .bub{background:#0b1119;color:var(--txt)}
  .msg.ai .bub{background:rgba(34,211,238,.08);color:var(--txt);border:1px solid rgba(34,211,238,.15)}
  .msg .bub code{color:var(--warn);font-family:monospace;font-size:11px}
  .cand{display:flex;align-items:center;gap:11px;padding:10px;background:#0b1119;border:1px solid rgba(251,146,60,.3);border-radius:9px}
  .cand .box{width:44px;height:44px;border-radius:8px;background:rgba(251,146,60,.15);border:1.5px solid var(--warn);display:flex;align-items:center;justify-content:center;font-size:18px}
  .cand .info{flex:1}.cand .info .t{font-weight:700;font-size:13px;color:var(--warn)}
  .cand .info .s{font-size:11px;color:var(--dim);margin-top:2px}
  .cand .conf{text-align:right;font-family:monospace}.cand .conf b{font-size:16px;color:var(--warn)}.cand .conf span{display:block;font-size:9px;color:var(--dim2)}
  .note{margin-top:9px;font-size:11px;color:var(--dim);line-height:1.5;padding:8px 10px;background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.2);border-radius:8px}
  .note b{color:var(--dang)}
  .wc-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:6px 0;border-bottom:1px solid #1a212b}
  .wc-row:last-child{border:none}.wc-row span{color:var(--dim)}.wc-row b{color:var(--txt);font-family:monospace;font-size:11px}
  .wc-row .auto{color:var(--ok);font-size:10px}
  .btns{display:flex;gap:8px;margin-top:2px}
  .btn{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line2);background:#0b1119;color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.ok{border-color:rgba(74,222,128,.4);color:var(--ok)}.btn.no{border-color:rgba(248,113,113,.3);color:var(--dang)}
  .status-bar{display:flex;gap:10px;align-items:center;padding:11px 20px;background:var(--panel2);border-top:1px solid var(--line);font-size:11px;color:var(--dim2)}
  .status-bar .live{color:var(--ok)}.status-bar .live::before{content:'●';margin-right:4px;font-size:8px}
  .status-bar b{color:var(--dim)}
</style></head><body>
<div class="device">
  <div class="top">
    <div class="logo"><span class="dot"></span>MRO Copilot <small>이동형 검사 로봇 · ROBOT-01</small></div>
    <div class="wo"><span>배터리 <b>82%</b></span><span id="conn" class="conn off">연결 확인 중…</span></div>
  </div>
  <div class="nav">
    <a href="/">① 정비사 단말</a>
    <a href="/orchestration.html">② 오케스트레이션</a>
    <a href="/robot.html" class="on">③ 로봇 검사</a>
  </div>
  <div class="grid">
    <div class="cam">
      <div class="cam-label"><span class="rec"></span>CAM-01 · 동체 외판 내측 (사각지대)</div>
      <img class="skin-img" src="assets/corrosion_al.jpg" alt="skin corrosion">
      <div class="cam-overlay"></div>
      <div class="scanband"></div>
      <div class="bbox2" id="bbox" style="top:30%;left:26%;width:44%;height:52%">
        <span class="bbox-tag" id="bboxTag">CANDIDATE · CORROSION</span>
      </div>
      <div class="cam-meta" id="camMeta"></div>
      <div class="cam-src">📷 실제 결함 이미지 · Al 공식부식 · Wikimedia Commons (CC BY-SA 4.0)</div>
    </div>
    <div class="side" id="side">
      <div class="card"><h3>지식그래프 조회 중…</h3></div>
    </div>
  </div>
  <div class="status-bar">
    <span class="live">로봇 실행 로그 기록 중</span>
    <span style="color:var(--dim2)"><b>공구 전달·Tool Control</b> — 검증 이후 확장 비전 (PoC 범위 밖)</span>
    <span><b>원격</b> 영상 공유 가능</span>
    <span id="srcMeta"></span>
  </div>
</div>
<script>
const KOR={CORRODED:'부식',CRACKED:'균열',DAMAGED:'손상',DENTED:'찍힘'};
async function checkConn(){
  const c=document.getElementById('conn');
  try{const r=await fetch('/api/parts');const j=await r.json();
    if(Array.isArray(j)){c.className='conn on';c.textContent='● 지식그래프 연결됨';}
  }catch(e){c.className='conn off';c.textContent='✗ 서버 미연결';}
}
async function load(){
  await checkConn();
  const r=await fetch('/api/robot');const j=await r.json();
  if(j.error){document.getElementById('side').innerHTML='<div class="card"><h3>데이터 조회 실패</h3></div>';return;}
  const sc=j.scene||{}, pt=j.part||{};
  const conf=sc.candConf!=null?sc.candConf:0.87;
  const loc=(sc.fs?('FR'+sc.fs):'')+(sc.str?(' / STR'+sc.str):'');
  const quality=sc.quality!=null?sc.quality:0.92;

  document.getElementById('bboxTag').textContent='CANDIDATE · CORROSION  conf '+conf;
  document.getElementById('camMeta').innerHTML=
    '<span>'+(sc.str?('STR '+sc.str):'STR 29L')+' · '+(sc.fs?('FR '+sc.fs):'FR 73')+'</span>'+
    '<span>품질 '+quality+' ✓</span><span>조명 ON · 자세 -12°</span>';

  // 부품 결함 분포 (실데이터)
  const defs=(pt.defects||[]).filter(x=>x.name).slice(0,3);
  const total=pt.total||0;
  const distTxt=defs.map(d=>(KOR[d.name]||d.name)+' '+d.weight+'건').join(' · ');

  document.getElementById('side').innerHTML=
    '<div class="card"><h3>🎙️ 음성 지원 챗봇</h3><div class="chat">'+
      '<div class="msg tech"><div class="av">🧑‍🔧</div><div class="bub">"여기 '+(sc.str||'STR29')+' 부근 촬영해줘"</div></div>'+
      '<div class="msg ai"><div class="av">🤖</div><div class="bub">검사위치 <code>'+(loc||'FR73 / STR29L')+'</code> 이동 완료. '+(sc.blind?'사각지대라 ':'')+'조명 켜고 자세 조정 후 촬영합니다.</div></div>'+
      '<div class="msg tech"><div class="av">🧑‍🔧</div><div class="bub">"이 부품 전에 문제 있었어?"</div></div>'+
      '<div class="msg ai"><div class="av">🤖</div><div class="bub">동체 외판(SKIN)은 <code>'+distTxt+'</code> 반복 부위입니다. 지식그래프 조회 결과입니다.</div></div>'+
    '</div></div>'+
    '<div class="card"><h3>🔍 이상 후보 탐지 <span style="margin-left:auto;font-weight:400;text-transform:none;color:var(--dim2)">AI 비전</span></h3>'+
      '<div class="cand"><div class="box">🟠</div><div class="info"><div class="t">CORROSION 부식 후보</div>'+
      '<div class="s">'+(loc||'STR29L · FR73')+' · bbox 표시됨</div></div>'+
      '<div class="conf"><b>'+conf+'</b><span>신뢰도</span></div></div>'+
      '<div class="note">⚠️ AI·로봇은 <b>결함후보</b>까지만 생성합니다. 최종 결함 판정은 <b>정비사</b>가 수행합니다. <span style="color:var(--dim2)">(C-12)</span></div>'+
      '<div class="btns"><button class="btn ok">✓ 이상 (판정)</button><button class="btn">정상</button><button class="btn no">재검사</button></div></div>'+
    '<div class="card"><h3>📋 Work Card 자동 기록</h3>'+
      '<div class="wc-row"><span>검사 위치</span><b>'+(loc||'FR73 / STR29L')+'</b></div>'+
      '<div class="wc-row"><span>촬영 증빙</span><b>EV-01.jpg <span class="auto">자동 연결</span></b></div>'+
      '<div class="wc-row"><span>품질점수</span><b>'+quality+' <span class="auto">기준 통과</span></b></div>'+
      '<div class="wc-row"><span>후보 결과</span><b>부식 '+conf+'</b></div>'+
      '<div class="wc-row"><span>정비사 판정</span><b style="color:var(--warn)">대기 중</b></div></div>';

  document.getElementById('srcMeta').innerHTML='<b>검사위치</b> '+(sc.area||'동체 외판 내측')+' · 지식그래프 실시간';
}
load();
</script>
</body></html>
