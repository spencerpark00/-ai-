<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRO Copilot — 정비 작업 도우미</title>
<style>
  :root{--bg:#0a0e14;--panel:#131a24;--panel2:#1a2330;--line:#26313f;--line2:#334155;
    --txt:#e8eef5;--dim:#8a99ab;--dim2:#5f6f80;--acc:#22d3ee;--acc2:#2dd4bf;--ok:#4ade80;
    --warn:#fbbf24;--dang:#f87171;--corr:#fb923c;--robot:#a78bfa;
    --r-red:#f87171;--r-org:#fb923c;--r-yel:#fbbf24;--r-grn:#4ade80;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Pretendard','Malgun Gothic',-apple-system,sans-serif;font-size:14px;line-height:1.55}
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column;position:relative}
  /* 헤더: 작업 맥락 */
  .head{background:linear-gradient(120deg,#0d1420,#131a24);border-bottom:1px solid var(--line);padding:13px 18px}
  .head .r1{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim)}
  .head .r1 .lg{font-weight:800;font-size:13px;color:var(--txt);display:flex;align-items:center;gap:6px}
  .head .r1 .lg .dot{width:8px;height:8px;border-radius:50%;background:var(--acc)}
  .head .conn{margin-left:auto;font-size:10.5px;padding:2px 9px;border-radius:20px}
  .head .conn.on{background:rgba(74,222,128,.12);color:var(--ok)}.head .conn.off{background:rgba(248,113,113,.12);color:var(--dang)}
  .head h1{font-size:16px;font-weight:700;margin-top:7px}
  .head .meta{font-size:11.5px;color:var(--dim);margin-top:3px}.head .meta b{color:var(--txt)}
  /* 5단계 진행바 */
  .prog{display:flex;padding:12px 14px;background:var(--panel2);border-bottom:1px solid var(--line);gap:2px}
  .pstep{flex:1;text-align:center;font-size:10px;color:var(--dim2);position:relative}
  .pstep .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:10px;margin:0 auto 4px;background:var(--panel)}
  .pstep.done{color:var(--ok)}.pstep.done .n{border-color:var(--ok);background:rgba(74,222,128,.14);color:var(--ok)}
  .pstep.now{color:var(--acc)}.pstep.now .n{border-color:var(--acc);background:rgba(34,211,238,.14);color:var(--acc);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
  /* 본문 */
  .body{flex:1;padding:18px;overflow-y:auto}
  .stage{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .lead{font-size:13px;color:var(--dim);margin-bottom:14px;text-align:center;line-height:1.6}
  .lead b{color:var(--txt)}
  /* 작업 카드 */
  .wocard{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .wocard .t{font-size:11px;color:var(--dim2);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:8px}
  .wocard h2{font-size:18px;font-weight:700}
  .wocard .row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid #1a212b}
  .wocard .row:last-child{border:none}.wocard .row span{color:var(--dim)}.wocard .row b{color:var(--txt)}
  .wocard .pri{display:inline-block;font-size:11px;background:rgba(248,113,113,.14);color:var(--dang);border-radius:20px;padding:2px 10px;font-weight:600;margin-top:8px}
  /* 오늘의 작업 목록 */
  .worklist{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .wl{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px 14px;cursor:pointer;transition:border-color .15s,transform .1s}
  .wl:active{transform:scale(.99)} .wl:hover{border-color:var(--line2)}
  .wl.done{opacity:.5;cursor:default}
  .wl-risk{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap;flex:none}
  .wl-risk.red{background:rgba(248,113,113,.15);color:#f87171}
  .wl-risk.org{background:rgba(251,146,60,.15);color:#fb923c}
  .wl-risk.yel{background:rgba(250,204,21,.13);color:#eab308}
  .wl-m{flex:1;min-width:0}
  .wl-t{font-size:15px;font-weight:700;color:var(--txt)}
  .wl-s{font-size:12px;color:var(--dim);margin-top:2px}
  .wl-go{font-size:13px;font-weight:700;color:var(--acc2);flex:none}
  .wl-done{font-size:12px;font-weight:700;color:var(--dim2);flex:none}
  .back{font-size:13px;color:var(--dim);cursor:pointer;margin-bottom:10px;display:inline-block}
  .back:hover{color:var(--txt)}
  .xfer{background:rgba(56,189,248,.09);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:12.5px;color:var(--dim);text-align:center;margin-top:8px}
  .xfer b{color:var(--txt)}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04222b;font-weight:700;font-size:13px;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:80;box-shadow:0 6px 22px rgba(0,0,0,.45);max-width:88%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 큰 버튼 */
  .btn{width:100%;padding:15px;border-radius:13px;border:none;cursor:pointer;font-size:15px;font-weight:700;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s}
  .btn:active{transform:scale(.98)}
  .btn.main{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04222b}
  .btn.robot{background:rgba(167,139,250,.12);border:1.5px solid var(--robot);color:var(--robot)}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line2);color:var(--txt)}
  .btn+.btn{margin-top:10px}
  .caphint{font-size:11.5px;color:var(--dim2);text-align:center;margin:10px 0}
  /* 촬영 선택 */
  .reqcuts{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:16px}
  .reqcuts .t{font-size:11px;color:var(--dim);margin-bottom:8px}
  .reqcuts .cut{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;color:var(--txt)}
  .reqcuts .cut .lc{margin-left:auto;font-family:monospace;font-size:11px;color:var(--warn)}
  /* AI 결과 카드 (위험도 먼저) */
  .result{border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px}
  .risk{padding:18px;text-align:center;color:#0a0e14}
  .risk.red{background:linear-gradient(135deg,#f87171,#ef4444)}
  .risk.org{background:linear-gradient(135deg,#fb923c,#f97316)}
  .risk.yel{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
  .risk.grn{background:linear-gradient(135deg,#4ade80,#22c55e)}
  .risk .lv{font-size:24px;font-weight:800;letter-spacing:-.5px}
  .risk .sub{font-size:12px;opacity:.85;margin-top:2px;font-weight:600}
  .rbody{background:var(--panel2);padding:16px}
  .rbody .row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:8px 0;border-bottom:1px solid #1a212b}
  .rbody .row:last-of-type{border:none}
  .rbody .row span{color:var(--dim);font-size:12.5px}.rbody .row b{color:var(--txt);font-weight:600}
  .rbody .row .big{font-size:16px}
  /* 드릴다운(근거) */
  .drill{margin-top:12px}
  .dbtn{width:100%;display:flex;align-items:center;gap:8px;background:#0b1119;border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--dim);font-size:12.5px;cursor:pointer;font-family:inherit;margin-bottom:7px}
  .dbtn:hover{border-color:var(--acc);color:var(--acc)}
  .dbtn .ar{margin-left:auto;transition:transform .2s}
  .dbtn.open .ar{transform:rotate(90deg)}
  .dpanel{display:none;padding:11px 13px;background:#0b1119;border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;margin-top:-9px;margin-bottom:7px}
  .dpanel.show{display:block;animation:fade .25s}
  .dpanel .ev{margin-bottom:9px}.dpanel .ev:last-child{margin-bottom:0}
  .dpanel .ev .eh{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
  .dpanel .ev .ac{font-size:12px;font-weight:700;color:var(--acc2)}
  .dpanel .ev .lc{font-size:10.5px;color:var(--warn);font-family:monospace;white-space:nowrap}
  .dpanel .ev .tx{font-size:11px;color:var(--dim);font-family:monospace;line-height:1.5}
  .dpanel .ev .sc{font-size:9.5px;color:var(--dim2);margin-top:4px}
  .dpanel .chip{display:inline-block;font-size:10.5px;background:#131a24;border:1px solid var(--line);border-radius:6px;padding:3px 8px;margin:2px 3px 2px 0;color:var(--txt)}
  .dpanel .tool{color:var(--acc);border-color:rgba(34,211,238,.2);background:rgba(34,211,238,.06)}
  .dpanel .warn{font-size:10.5px;color:var(--dim);padding:5px 8px;background:rgba(248,113,113,.06);border-left:2px solid var(--dang);border-radius:4px;margin:4px 0}
  .dpanel .warn b{color:var(--dang)}
  .dpanel .conf{font-size:11px;color:var(--dim);text-align:center;padding:4px}.dpanel .conf b{color:var(--txt);font-size:15px}
  /* 결정 버튼 */
  .decide{margin-top:6px}
  .decide .lbl{font-size:12px;color:var(--dim);text-align:center;margin-bottom:9px}
  .jbtns{display:flex;gap:8px}
  .jb{flex:1;padding:14px 6px;border-radius:12px;border:1.5px solid var(--line2);background:#0b1119;color:var(--dim);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .jb.ok{border-color:rgba(74,222,128,.4);color:var(--ok)}
  .jb.re{border-color:rgba(251,191,36,.4);color:var(--warn)}
  .jb.fix{border-color:rgba(248,113,113,.4);color:var(--dang)}
  /* 완료 */
  .done-c{text-align:center;padding:20px 10px}
  .done-c .ic{font-size:44px;margin-bottom:12px}
  .done-c h2{font-size:19px;font-weight:700;margin-bottom:6px}
  .done-c p{font-size:13px;color:var(--dim);line-height:1.6}
  .recbox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:16px 0;text-align:left}
  .recbox .row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0}
  .recbox .row span{color:var(--dim)}.recbox .row b{color:var(--txt)}
  .recbox .auto{color:var(--ok);font-size:10.5px}
  /* 하단 질문 바 (보조) */
  .askbar{border-top:1px solid var(--line);background:var(--panel);padding:11px 16px;display:flex;gap:9px;align-items:center}
  .mic{width:42px;height:42px;border-radius:50%;flex-shrink:0;border:none;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04222b;font-size:17px}
  .mic.rec{background:linear-gradient(135deg,var(--dang),#f97316);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.5)}50%{box-shadow:0 0 0 8px rgba(248,113,113,0)}}
  .askin{flex:1;background:#0b1119;border:1px solid var(--line2);border-radius:22px;padding:11px 15px;color:var(--txt);font-size:14px;font-family:inherit}
  .askin::placeholder{color:var(--dim2)}
  /* 질문 답변 오버레이 */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:60}
  .sheet.show{display:flex;animation:fade .25s}
  .sheetbox{background:var(--panel);border:1px solid var(--line2);border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:80vh;overflow-y:auto}
  .sheetbox .sh{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-weight:700}
  .sheetbox .sh .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:19px}
  .sheetbody{padding:14px 16px}
  .sheetask{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--panel);border-top:1px solid var(--line)}
  .qbub{background:var(--acc);color:#04222b;padding:8px 13px;border-radius:12px 12px 4px 12px;font-size:13px;font-weight:600;margin:0 0 10px auto;display:block;width:fit-content;max-width:80%}
  .botmsg{background:var(--panel2);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:11px 14px;font-size:13.5px;line-height:1.65;margin-bottom:14px;max-width:88%;white-space:normal}
  .rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .rchip{font-size:11.5px;background:#0b1119;border:1px solid var(--line2);border-radius:16px;padding:5px 12px;color:var(--acc);cursor:pointer}
  .rchip:hover{background:rgba(34,211,238,.1);border-color:var(--acc)}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
  .card h3{font-size:11px;color:var(--dim);text-transform:uppercase;font-weight:600;margin-bottom:10px;display:flex;gap:6px}
  .defect{margin-bottom:8px}.defect .dl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
  .defect .dl span{color:var(--dim)}.track{height:6px;background:#0b1119;border-radius:4px;overflow:hidden}.track div{height:100%;transition:width .7s}
  /* 로봇 촬영 모달 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
  .modal.show{display:flex;animation:fade .25s}
  .msheet{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:100%;max-width:420px;overflow:hidden}
  .msheet .sh{display:flex;align-items:center;gap:8px;padding:13px 16px;background:linear-gradient(90deg,#1a1430,#131a24);border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
  .msheet .sh .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:18px}
  .cam{position:relative;height:210px;background:#05080d;overflow:hidden}
  .cam img{width:100%;height:100%;object-fit:cover;filter:brightness(.82) contrast(1.05)}
  .cam .ov{position:absolute;inset:0;box-shadow:inset 0 0 70px rgba(5,8,13,.7)}
  .cam .scan{position:absolute;left:0;right:0;height:55px;background:linear-gradient(180deg,transparent,rgba(167,139,250,.3),transparent);animation:scan 2.4s ease-in-out infinite}
  @keyframes scan{0%,100%{top:5%}50%{top:76%}}
  .cam .bb{position:absolute;top:30%;left:26%;width:44%;height:50%;border:2px solid #fb923c;border-radius:4px;animation:bp 1.6s infinite}
  @keyframes bp{50%{border-color:rgba(251,146,60,.4)}}
  .cam .bbt{position:absolute;top:-17px;left:-2px;font-family:monospace;font-size:9px;background:#fb923c;color:#0a0e14;padding:1px 6px;border-radius:3px;font-weight:700}
  .cam .lbl{position:absolute;top:9px;left:11px;font-family:monospace;font-size:9.5px;color:var(--robot);background:rgba(0,0,0,.5);padding:3px 8px;border-radius:5px;display:flex;gap:5px;align-items:center}
  .cam .rc{width:6px;height:6px;border-radius:50%;background:var(--dang);animation:blink 1.1s infinite}
  @keyframes blink{50%{opacity:.3}}
  .mbody{padding:15px 16px;text-align:center}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--dim2);border-top-color:var(--robot);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style></head><body>
<div class="app">
  <div class="head">
    <div class="r1"><span class="lg"><span class="dot"></span>MRO Copilot</span><span>정비 작업 도우미</span><span id="conn" class="conn off">연결 중…</span><span onclick="doLogout()" style="font-size:10.5px;color:var(--dim2);cursor:pointer;padding:2px 4px" title="로그아웃">로그아웃</span></div>
    <h1 id="woTitle">작업 불러오는 중…</h1>
    <div class="meta" id="woMeta"></div>
  </div>
  <div class="prog" id="prog"></div>
  <div class="body" id="body"></div>
  <div class="askbar">
    <button class="mic" id="mic" onclick="startVoice()">🎙️</button>
    <input class="askin" id="ask" placeholder="검사 중 궁금한 걸 물어보세요" onkeydown="if(event.key==='Enter')doAsk()">
  </div>
</div>

<!-- 질문 답변 오버레이 -->
<div class="sheet" id="sheet"><div class="sheetbox">
  <div class="sh">💬 <span id="askQ">질문</span><span class="x" onclick="closeSheet()">✕</span></div>
  <div class="sheetbody" id="sheetBody"></div>
  <div class="sheetask">
    <button class="mic" id="mic2" onclick="startVoice('ask2')">🎙️</button>
    <input class="askin" id="ask2" placeholder="이어서 물어보세요" onkeydown="if(event.key==='Enter')doAsk2()">
  </div>
</div></div>

<!-- 로봇 촬영 모달 -->
<div class="modal" id="modal"><div class="msheet">
  <div class="sh">🤖 로봇 촬영 <span style="font-size:11px;color:var(--dim);font-weight:400" id="mLoc"></span><span class="x" onclick="closeModal()">✕</span></div>
  <div class="cam"><div class="lbl"><span class="rc"></span>CAM-01 · 사각지대</div><img src="assets/corrosion_al.jpg" alt="검사"><div class="ov"></div><div class="scan"></div><div class="bb"><span class="bbt" id="bbt">CORROSION</span></div></div>
  <div class="mbody" id="mBody"></div>
</div></div>

<script>
// ── 진입 가드 / 로그아웃 (로그인은 통합 랜딩 /login.html 에서 처리) ──
function isTech(){ try{ return sessionStorage.getItem('mroRole')==='tech'; }catch(e){ return false; } }
function doLogout(){ try{ sessionStorage.removeItem('mroRole'); }catch(e){} location.replace('/'); }
const KOR={DAMAGED:'손상',CORRODED:'부식',CRACKED:'균열',DENTED:'찍힘',GOUGED:'긁힘',PUNCTURED:'천공',WORN:'마모',DELAMINATED:'박리',BROKEN:'파손',MISSING:'누락'};
const COLOR={DAMAGED:'var(--dmg,#fbbf24)',CORRODED:'var(--corr)',CRACKED:'var(--dang)'};
// 위험도 매핑 (구조 안전 기준 · 실도입 시 운항영향 통계로 확정)
const RISK={CRACKED:['red','즉시 조치','구조 안전 직결 — 다음 비행 전 처리'],
  CORRODED:['org','정비 필요','진행성 손상 — 허용한도 확인 후 조치'],
  DAMAGED:['org','정비 필요','손상 범위 평가 필요'],
  PUNCTURED:['red','즉시 조치','관통 손상'],DENTED:['yel','경미','허용한도 내 가능성'],
  GOUGED:['yel','경미','표면 손상'],WORN:['yel','경미','마모 관찰']};
let WORKS=[], CURWORK=null, STEP=0, FINDING=null;
const RISKB={긴급:['red','🔴'],주의:['org','🟠'],정상:['yel','🟢']};

async function boot(){ await loadWorks(); showList(); }
async function loadWorks(){
  try{
    const r=await fetch('/api/works'); WORKS=await r.json();
    document.getElementById('conn').className='conn on';document.getElementById('conn').textContent='● 연결됨';
  }catch(e){document.getElementById('conn').className='conn off';document.getElementById('conn').textContent='✗ 미연결';}
}
// 첫 화면 = 오늘의 작업 목록
function showList(){
  STEP=0; CURWORK=null; FINDING=null; renderProg();
  document.getElementById('woTitle').textContent='오늘의 작업';
  const wait=WORKS.filter(w=>w.status!=='완료'), doneN=WORKS.filter(w=>w.status==='완료').length;
  document.getElementById('woMeta').innerHTML='정비 필요 <b>'+wait.length+'건</b> · 완료 <b>'+doneN+'건</b>';
  const card=w=>{
    const rb=RISKB[w.risk]||['yel','🟢'], done=w.status==='완료';
    return '<div class="wl'+(done?' done':'')+'"'+(done?'':' onclick="pickWork(\''+w.id+'\')"')+'>'+
      '<span class="wl-risk '+rb[0]+'">'+rb[1]+' '+w.risk+'</span>'+
      '<div class="wl-m"><div class="wl-t">'+w.part+' '+w.defect+'</div>'+
      '<div class="wl-s">'+w.ac+' · '+w.area+'</div></div>'+
      (done?'<span class="wl-done">완료 ✓</span>':'<span class="wl-go">시작 →</span>')+'</div>';
  };
  document.getElementById('body').innerHTML=
    '<div class="stage"><div class="lead">오늘 배정된 <b>정비 작업</b>입니다. 하나씩 처리하세요.</div>'+
    '<div class="worklist">'+WORKS.map(card).join('')+'</div>'+
    '<div class="xfer">📤 완료한 작업은 <b>관리자 현황 대시보드로 자동 전달</b>됩니다.</div></div>';
}
function pickWork(id){
  CURWORK=WORKS.find(w=>w.id===id); if(!CURWORK)return;
  FINDING=null; captureBy='robot';
  document.getElementById('woTitle').textContent=CURWORK.part+' '+CURWORK.defect+' 검사';
  document.getElementById('woMeta').innerHTML='기체 <b>'+CURWORK.ac+'</b> · 부위 <b>'+CURWORK.part+' '+CURWORK.area+'</b>';
  STEP=1; renderProg(); renderStage();
}
function backToList(){ FINDING=null; showList(); }
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.innerHTML='📤 '+msg;
  t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},2800);
}
const STEPS=[['1','작업 받기'],['2','로봇 촬영'],['3','AI 결과'],['4','판정'],['5','기록']];
function renderProg(){
  const p=document.getElementById('prog');
  if(STEP<1){ p.innerHTML=''; return; }
  p.innerHTML=STEPS.map((s,i)=>{
    const n=i+1;const cls=n<STEP?'done':(n===STEP?'now':'');
    const ic=n<STEP?'✓':s[0];
    return '<div class="pstep '+cls+'"><div class="n">'+ic+'</div>'+s[1]+'</div>';
  }).join('');
}
function go(step){STEP=step;renderProg();renderStage();document.getElementById('body').scrollTop=0;}

function renderStage(){
  const b=document.getElementById('body');
  if(STEP===1){
    const w=CURWORK||{};
    b.innerHTML='<div class="stage"><div class="back" onclick="showList()">← 작업 목록</div>'+
      '<div class="lead">이 작업을 확인하고 시작하세요.</div>'+
      '<div class="wocard"><div class="t">작업 '+(w.id||'')+'</div><h2>'+(w.part||'SKIN')+' '+(w.defect||'외관')+' 검사</h2>'+
      '<div class="row"><span>기체</span><b>'+(w.ac||'EMB ERJ190')+'</b></div>'+
      '<div class="row"><span>검사 부위</span><b>'+(w.part||'SKIN')+' · '+(w.area||'FR73/STR29L')+'</b></div>'+
      '<div class="row"><span>예상 위험도</span><b>'+(w.risk||'주의')+'</b></div>'+
      '<span class="pri">우선순위 '+(w.risk==='긴급'?'긴급':'높음')+'</span></div>'+
      '<button class="btn main" onclick="go(2)">작업 시작 →</button></div>';
  }
  else if(STEP===2){
    b.innerHTML='<div class="stage"><div class="lead">검사할 곳은 <b>손이 닿기 어려운 사각지대</b>입니다.<br>로봇에게 촬영을 맡기거나 직접 촬영하세요.</div>'+
      '<div class="reqcuts"><div class="t">📷 촬영할 부위</div>'+
      '<div class="cut">동체 외판 내측 <span class="lc">FR73 / STR29L</span></div></div>'+
      '<button class="btn robot" onclick="openRobot(\'robot\')">🤖 로봇에게 촬영 맡기기</button>'+
      '<button class="btn ghost" onclick="openRobot(\'direct\')">📷 직접 촬영·업로드</button>'+
      '<div class="caphint">💡 "여기 찍어줘"라고 말해도 됩니다</div></div>';
  }
  else if(STEP===3){ renderResult(); }
  else if(STEP===5){
    const f=FINDING||{}, w=CURWORK||{};
    b.innerHTML='<div class="stage"><div class="done-c"><div class="ic">✅</div><h2>작업 기록 완료</h2>'+
      '<p>검사 결과가 자동 저장되고<br><b>관리자 대시보드에 실시간 반영</b>됐어요.</p></div>'+
      '<div class="recbox">'+
      '<div class="row"><span>작업</span><b>'+(w.id||'')+' · '+(w.part||'SKIN')+' '+(w.area||'FR73/STR29L')+'</b></div>'+
      '<div class="row"><span>촬영 방법</span><b>'+(captureBy==='direct'?'📷 직접':'🤖 로봇')+' <span class="auto">기록됨</span></b></div>'+
      '<div class="row"><span>발견</span><b>'+(f.kor||w.defect||'부식')+' · '+(f.conf||'0.87')+'</b></div>'+
      '<div class="row"><span>정비사 판정</span><b style="color:'+(f.jcol||'var(--dang)')+'">'+(f.judge||'수리')+'</b></div>'+
      '<div class="row"><span>작업 기록</span><b class="auto">자동 저장 ✓</b></div></div>'+
      (f.judge==='수리'?'<p style="font-size:12px;color:var(--dim);text-align:center;line-height:1.6">→ 승인 시 이 사례가 <b style="color:var(--txt)">다음 검사에 재활용</b>됩니다.</p>':'')+
      '<div class="xfer">📤 이 결과가 <b>관리자 현황 대시보드로 전달</b>됐어요.</div>'+
      '<button class="btn main" onclick="backToList()" style="margin-top:12px">← 작업 목록으로</button></div>';
  }
}
function renderResult(){
  const f=FINDING||{cond:'CORRODED',conf:'0.87'};
  const rk=RISK[f.cond]||['org','정비 필요',''];
  const kor=KOR[f.cond]||'부식';f.kor=kor;
  const loc=(CURWORK&&CURWORK.area)||'FR73 / STR29L';
  const capLead = captureBy==='direct' ? '촬영하고 <b>AI가 이상한 곳을 찾았습니다.</b>' : '로봇이 촬영하고 <b>AI가 이상한 곳을 찾았습니다.</b>';
  document.getElementById('body').innerHTML='<div class="stage">'+
    '<div class="lead">'+capLead+'<br>결과를 확인하고 판정하세요.</div>'+
    '<div class="result">'+
      '<div class="risk '+rk[0]+'"><div class="lv">'+(rk[0]==='red'?'🔴':(rk[0]==='org'?'🟠':(rk[0]==='yel'?'🟡':'🟢')))+' '+rk[1]+'</div><div class="sub">'+rk[2]+'</div></div>'+
      '<div class="rbody">'+
        '<div class="row"><span>결함 종류</span><b class="big">'+kor+' ('+f.cond+')</b></div>'+
        '<div class="row"><span>위치</span><b>동체 외판 · '+loc+'</b></div>'+
        '<div class="row"><span>다음 조치</span><b>부식 제거·처리 (검사 절차 아래)</b></div>'+
        '<div class="row"><span>예상 소요</span><b>약 25분</b></div>'+
      '</div></div>'+
    // 드릴다운
    '<div class="drill">'+
      '<div class="dbtn" onclick="toggle(this,\'d1\')">🔎 왜 이렇게 판단했나 · 과거 사례 <span class="ar">›</span></div><div class="dpanel" id="d1"></div>'+
      '<div class="dbtn" onclick="toggle(this,\'d2\')">🛠 검사 절차·공구·주의사항 <span class="ar">›</span></div><div class="dpanel" id="d2"></div>'+
    '</div>'+
    // 결정
    '<div class="decide"><div class="lbl">이 결과를 어떻게 처리할까요?</div>'+
    '<div class="jbtns"><button class="jb ok" onclick="judge(\'정상\',\'var(--ok)\')">✓ 정상</button>'+
    '<button class="jb re" onclick="judge(\'재검사\',\'var(--warn)\')">↺ 재검사</button>'+
    '<button class="jb fix" onclick="judge(\'수리\',\'var(--dang)\')">🔧 수리</button></div></div>'+
    '</div>';
  loadDrill();
}
async function loadDrill(){
  // 과거 사례 + 절차를 지식그래프에서
  try{
    const r=await fetch('/api/query?q='+encodeURIComponent((CURWORK&&CURWORK.part)||'SKIN'));const j=await r.json();
    const d=j.data||{};const cases=(d.cases||[]).filter(c=>c.sum).slice(0,2);
    const procs=(j.procedures||[]).slice(0,2);
    document.getElementById('d1').innerHTML=(cases.length?cases.map(c=>'<div class="ev"><div class="eh"><span class="ac">'+(KOR[c.cond]||c.cond)+' 과거 사례</span><span class="lc">'+(c.fs?'FR'+c.fs:'')+(c.str?' / STR'+c.str:'')+'</span></div><div class="tx">"'+(c.sum||'').slice(0,110)+'…"</div><div class="sc">📄 실제 정비 보고 · '+(c.ac||'-')+'</div></div>').join(''):'<p style="font-size:11px;color:var(--dim2)">유사 사례 조회 중…</p>')+
      '<div class="conf" style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px">AI 신뢰도 <b>87%</b> · 같은 부위에서 부식이 반복 보고됨</div>';
    document.getElementById('d2').innerHTML=procs.length?procs.map(p=>{
      const st=(p.steps||[]).map((s,i)=>'<span class="chip">'+(i+1)+'. '+s+'</span>').join('');
      const tl=(p.tools||[]).map(t=>'<span class="chip tool">🔧 '+t+'</span>').join('');
      const wn=(p.warnings||[]).filter(w=>w.text).slice(0,2).map(w=>'<div class="warn"><b>'+w.type+'</b> '+w.text+'</div>').join('');
      return '<div style="margin-bottom:10px"><div style="font-weight:700;font-size:12.5px;color:var(--acc2);margin-bottom:5px">'+p.procedure+'</div>'+st+tl+wn+'<div class="sc" style="margin-top:4px">📘 '+(p.source||'FAA 핸드북')+' · '+(p.page||'')+'</div></div>';
    }).join(''):'<p style="font-size:11px;color:var(--dim2)">절차 조회 중…</p>';
  }catch(e){}
}
function toggle(btn,id){btn.classList.toggle('open');document.getElementById(id).classList.toggle('show');}

// ── 로봇/직접 촬영 ──
let captureBy='robot';
function openRobot(by){
  captureBy = by || 'robot';
  const m=document.getElementById('modal');m.classList.add('show');
  document.querySelector('#modal .sh').firstChild.textContent = captureBy==='direct' ? '📷 직접 촬영 ' : '🤖 로봇 촬영 ';
  document.getElementById('mLoc').textContent=(CURWORK&&CURWORK.area)||'FR73/STR29L';
  const msg = captureBy==='direct' ? '촬영·업로드 중…' : '로봇 이동·조명·촬영 중…';
  document.getElementById('mBody').innerHTML='<div style="color:var(--dim2);font-size:12.5px;padding:12px"><span class="spin"></span> '+msg+'</div>';
  fetch('/api/robot').then(r=>r.json()).then(j=>{
    const sc=j.scene||{};const conf=sc.candConf!=null?sc.candConf:0.87;const quality=sc.quality!=null?sc.quality:0.92;
    document.getElementById('bbt').textContent='CORROSION '+conf;
    setTimeout(()=>{
      document.getElementById('mBody').innerHTML='<p style="font-size:13px;color:var(--txt);margin-bottom:6px">촬영 완료 · 품질 <b>'+quality+'</b> ✓</p>'+
        '<p style="font-size:12px;color:var(--dim);margin-bottom:12px">AI가 이상 후보를 표시했어요.</p>'+
        '<button class="btn main" onclick="captured('+conf+')">AI 결과 보기 →</button>';
    },1500);
  }).catch(()=>{setTimeout(()=>{document.getElementById('mBody').innerHTML='<button class="btn main" onclick="captured(0.87)">AI 결과 보기 →</button>';},1200);});
}
const DEFC={부식:'CORRODED',균열:'CRACKED',찍힘:'DENTED',마모:'WORN',흠집:'GOUGED',손상:'DAMAGED'};
function captured(conf){const c=(CURWORK&&DEFC[CURWORK.defect])||'CORRODED';FINDING={cond:c,conf:conf};closeModal();go(3);}
function closeModal(){document.getElementById('modal').classList.remove('show');}
async function judge(v,col){
  FINDING=FINDING||{}; FINDING.judge=v; FINDING.jcol=col;
  // 정비사 판정 → 서버로 전송 → 관리자 대시보드 실시간 반영
  if(CURWORK){
    const verdict = v==='정상'?'정상':(v==='재검사'?'재검사':'수리');
    try{
      await fetch('/api/works/complete',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:CURWORK.id, capturedBy:captureBy, verdict})});
      CURWORK.status='완료';
    }catch(e){}
    await loadWorks();
    toast('오늘 정비 결과가 관리자 현황 대시보드로 전달됐습니다');
  }
  go(5);
}
function restart(){ backToList(); }

// ── 질문(보조) ──
let recog=null,recActive=false;
function startVoice(box){
  box = box || 'ask';                                   // 'ask'(메인) 또는 'ask2'(시트)
  const micId = box==='ask2' ? 'mic2' : 'mic';
  const submit = box==='ask2' ? doAsk2 : doAsk;
  const ph = box==='ask2' ? '이어서 물어보세요' : '검사 중 궁금한 걸 물어보세요';
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const mic=document.getElementById(micId); const inp=document.getElementById(box);
  if(!SR){inp.placeholder='음성 미지원 — Chrome/Edge 또는 텍스트 입력';return;}
  if(recActive){recog&&recog.stop();return;}
  recog=new SR();recog.lang='ko-KR';recog.interimResults=true;recActive=true;mic.classList.add('rec');
  inp.placeholder='🎙️ 듣고 있어요…';
  recog.onresult=function(ev){let t='';for(let i=ev.resultIndex;i<ev.results.length;i++)t+=ev.results[i][0].transcript;
    inp.value=t;
    if(ev.results[ev.results.length-1].isFinal){recog.stop();setTimeout(submit,200);}};
  recog.onerror=function(){recActive=false;mic.classList.remove('rec');};
  recog.onend=function(){recActive=false;mic.classList.remove('rec');inp.placeholder=ph;};
  recog.start();
}
// 시트 안 입력창에서 이어질문
function doAsk2(){
  const inp=document.getElementById('ask2');const term=inp.value.trim();if(!term)return;inp.value='';
  if(/찍어|촬영|스캔|카메라/.test(term)){openRobot();return;}
  askServer(term);
}
let lastPart='SKIN';
let chatHist=[];   // 최근 대화 [{role:'user'|'bot', text}] — 서버로 보내 맥락 유지
async function doAsk(){
  const inp=document.getElementById('ask');const term=inp.value.trim();if(!term)return;inp.value='';
  if(/찍어|촬영|스캔|카메라/.test(term)){openRobot();return;}
  askServer(term);
}
async function askServer(term){
  const sheet=document.getElementById('sheet');sheet.classList.add('show');
  document.getElementById('askQ').textContent='작업 도우미';
  setTimeout(function(){var a=document.getElementById('ask2');if(a)a.focus();},60);
  const body=document.getElementById('sheetBody');
  // 기존 대화 유지하며 질문 추가 (대화형)
  const prev=body.getAttribute('data-init')==='1'?body.innerHTML:'';
  body.setAttribute('data-init','1');
  body.innerHTML=prev+'<div class="qbub">'+term+'</div>'+
    '<div class="botmsg" id="pending"><span class="spin"></span> 확인 중…</div>';
  body.scrollTop=body.scrollHeight;
  try{
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({q:term, history:chatHist})});
    const j=await r.json(); const ans=j.answer||{};
    lastPart=j.part||lastPart;
    document.getElementById('pending').outerHTML=renderBot(ans);
    chatHist.push({role:'user',text:term}); chatHist.push({role:'bot',text:ans.text||''});
    if(chatHist.length>12) chatHist=chatHist.slice(-12);   // 최근 6턴만 유지
  }catch(e){ document.getElementById('pending').outerHTML='<div class="botmsg">조회 실패</div>'; }
  body.scrollTop=body.scrollHeight;
}
function renderBot(a){
  if(!a) return '<div class="botmsg">답변을 만들지 못했어요.</div>';
  const text=(a.text||'').replace(/\n/g,'<br>');
  const chips=(a.chips||[]).map(c=>'<span class="rchip" onclick="askServer(\''+c+' '+lastPart+'\')">'+c+'</span>').join('');
  return '<div class="botmsg">'+text+(chips?'<div class="rchips">'+chips+'</div>':'')+'</div>';
}
function closeSheet(){const b=document.getElementById('sheetBody');b.innerHTML='';b.removeAttribute('data-init');chatHist=[];document.getElementById('sheet').classList.remove('show');}
// 정비사로 로그인하지 않고 직접 접근하면 로그인 창으로 되돌림
if(isTech()){ boot(); } else { location.replace('/'); }
