<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRO Copilot — 정비사 앱 (통합)</title>
<style>
  :root{--bg:#0a0e14;--panel:#131a24;--panel2:#1a2330;--line:#26313f;--line2:#334155;
    --txt:#e8eef5;--dim:#8a99ab;--dim2:#5f6f80;--acc:#22d3ee;--acc2:#2dd4bf;--ok:#4ade80;
    --warn:#fbbf24;--dang:#f87171;--corr:#fb923c;--crack:#f87171;--dmg:#fbbf24;--violet:#a78bfa;--robot:#a78bfa;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Pretendard','Malgun Gothic',-apple-system,sans-serif;font-size:14px;line-height:1.55}
  .app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column}
  /* 상단: 작업 맥락 */
  .wohead{background:linear-gradient(120deg,#0d1420,#131a24);border-bottom:1px solid var(--line);padding:14px 18px}
  .wohead .r1{display:flex;align-items:center;gap:9px}
  .wohead .badge{font-size:10px;background:rgba(34,211,238,.14);color:var(--acc);border:1px solid rgba(34,211,238,.3);border-radius:20px;padding:2px 10px;font-weight:600}
  .wohead h1{font-size:16px;font-weight:700;margin-top:6px}
  .wohead .meta{display:flex;gap:14px;margin-top:5px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
  .wohead .meta b{color:var(--txt)}
  .conn{margin-left:auto;font-size:11px;padding:3px 10px;border-radius:20px}
  .conn.on{background:rgba(74,222,128,.12);color:var(--ok);border:1px solid rgba(74,222,128,.3)}
  .conn.off{background:rgba(248,113,113,.12);color:var(--dang);border:1px solid rgba(248,113,113,.3)}
  /* 진행 체크리스트(가로 스텝) */
  .steps{display:flex;gap:6px;padding:11px 18px;background:var(--panel2);border-bottom:1px solid var(--line);overflow-x:auto}
  .stp{display:flex;align-items:center;gap:6px;flex-shrink:0;font-size:11px;color:var(--dim2)}
  .stp .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:9px}
  .stp.done{color:var(--ok)}.stp.done .dot{border-color:var(--ok);background:rgba(74,222,128,.12);color:var(--ok)}
  .stp.now{color:var(--acc)}.stp.now .dot{border-color:var(--acc);background:rgba(34,211,238,.12);color:var(--acc)}
  .stp .arw{color:var(--line2)}
  /* 대화 영역 */
  .feed{flex:1;padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
  .hint{text-align:center;color:var(--dim2);font-size:12.5px;padding:24px 10px;line-height:1.7}
  .hint b{color:var(--dim)}
  .qbub{align-self:flex-end;background:var(--acc);color:#04222b;padding:9px 14px;border-radius:14px 14px 4px 14px;font-size:14px;font-weight:600;max-width:80%}
  .ans{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:10px}
  .card:last-child{margin-bottom:0}
  .card h3{font-size:11px;letter-spacing:.5px;color:var(--dim);text-transform:uppercase;font-weight:600;margin-bottom:11px;display:flex;align-items:center;gap:6px}
  .defect{margin-bottom:9px}.defect:last-child{margin-bottom:0}
  .defect .dl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .defect .dl span{color:var(--dim);font-variant-numeric:tabular-nums}
  .track{height:7px;background:#0b1119;border-radius:5px;overflow:hidden}
  .track div{height:100%;border-radius:5px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .ev{background:#0b1119;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px}
  .ev:last-child{margin-bottom:0}
  .ev .eh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
  .ev .ac{font-weight:700;font-size:12.5px;color:var(--acc2)}
  .ev .loc{font-size:10.5px;color:var(--warn);font-family:monospace;background:rgba(251,191,36,.1);padding:2px 7px;border-radius:5px;white-space:nowrap}
  .ev .txt{font-size:11px;color:var(--dim);line-height:1.5;font-family:monospace}
  .ev .src{font-size:10px;color:var(--dim2);margin-top:6px}
  .proc{background:#0b1119;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:9px}
  .proc:last-child{margin-bottom:0}
  .proc .pt{font-weight:700;font-size:13px;color:var(--acc2);margin-bottom:5px}
  .proc .psteps{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .chip{font-size:10.5px;background:#131a24;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--txt)}
  .tool{font-size:10.5px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.2);border-radius:6px;padding:3px 9px;color:var(--acc)}
  .warn{font-size:10.5px;color:var(--dim);padding:5px 9px;background:rgba(248,113,113,.06);border-left:2px solid var(--dang);border-radius:4px;margin-bottom:4px}
  .warn b{color:var(--dang)}
  .psrc{font-size:9.5px;color:var(--dim2);margin-top:5px}
  /* 로봇 촬영 제안 버튼 */
  .robotcta{display:flex;align-items:center;gap:10px;background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.3);border-radius:12px;padding:12px 14px;cursor:pointer;transition:background .15s}
  .robotcta:hover{background:rgba(167,139,250,.14)}
  .robotcta .ic{font-size:22px}
  .robotcta .t{flex:1}.robotcta .t b{font-size:13px;color:var(--robot)}.robotcta .t p{font-size:11px;color:var(--dim);margin-top:1px}
  .robotcta .go{font-size:11px;color:var(--robot);font-weight:700}
  /* 입력 바 */
  .inbar{padding:12px 18px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:9px;align-items:center}
  .mic{width:44px;height:44px;border-radius:50%;flex-shrink:0;border:none;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04222b;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(34,211,238,.3)}
  .mic.rec{background:linear-gradient(135deg,var(--dang),#f97316);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.5)}50%{box-shadow:0 0 0 8px rgba(248,113,113,0)}}
  .qin{flex:1;background:#0b1119;border:1px solid var(--line2);border-radius:22px;padding:12px 16px;color:var(--txt);font-size:15px;font-family:inherit}
  .qin::placeholder{color:var(--dim2)}
  .send{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;background:var(--acc);color:#04222b;font-size:17px;flex-shrink:0}
  .quick{display:flex;gap:7px;padding:0 18px 12px;background:var(--panel);overflow-x:auto}
  .qk{flex-shrink:0;font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:6px 12px;color:var(--dim);cursor:pointer}
  .qk:hover{border-color:var(--acc);color:var(--acc)}
  /* 로봇 팝업 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal.show{display:flex;animation:fade .25s}
  .sheet{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:100%;max-width:440px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .sheet .sh{display:flex;align-items:center;gap:9px;padding:13px 16px;background:linear-gradient(90deg,#1a1430,#131a24);border-bottom:1px solid var(--line)}
  .sheet .sh b{font-weight:700;font-size:14px}.sheet .sh .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:18px}
  .cam{position:relative;height:230px;background:#05080d;overflow:hidden}
  .cam img{width:100%;height:100%;object-fit:cover;filter:brightness(.82) contrast(1.05)}
  .cam .ov{position:absolute;inset:0;box-shadow:inset 0 0 80px rgba(5,8,13,.7)}
  .cam .scan{position:absolute;left:0;right:0;height:60px;background:linear-gradient(180deg,transparent,rgba(167,139,250,.3),transparent);animation:scan 2.6s ease-in-out infinite}
  @keyframes scan{0%,100%{top:6%}50%{top:74%}}
  .cam .bb{position:absolute;border:2px solid #fb923c;border-radius:4px;animation:bp 1.6s infinite}
  @keyframes bp{50%{border-color:rgba(251,146,60,.4)}}
  .cam .bbt{position:absolute;font-family:monospace;font-size:9px;background:#fb923c;color:#0a0e14;padding:1px 6px;border-radius:3px;font-weight:700}
  .cam .lbl{position:absolute;top:10px;left:12px;font-family:monospace;font-size:10px;color:var(--robot);background:rgba(0,0,0,.5);padding:3px 8px;border-radius:5px;display:flex;gap:6px;align-items:center}
  .cam .rec{width:7px;height:7px;border-radius:50%;background:var(--dang);animation:blink 1.1s infinite}
  @keyframes blink{50%{opacity:.3}}
  .sbody{padding:15px 16px}
  .rst{display:flex;align-items:center;gap:10px;background:#0b1119;border:1px solid rgba(251,146,60,.3);border-radius:10px;padding:11px}
  .rst .b{width:40px;height:40px;border-radius:8px;background:rgba(251,146,60,.15);border:1.5px solid var(--warn);display:flex;align-items:center;justify-content:center;font-size:17px}
  .rst .i{flex:1}.rst .i .t{font-weight:700;font-size:13px;color:var(--warn)}.rst .i .s{font-size:10.5px;color:var(--dim);margin-top:2px}
  .rst .c{font-family:monospace;text-align:right}.rst .c b{font-size:15px;color:var(--warn)}.rst .c span{display:block;font-size:8.5px;color:var(--dim2)}
  .note{font-size:10.5px;color:var(--dim);margin:9px 0;padding:8px 10px;background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.2);border-radius:8px}
  .note b{color:var(--dang)}
  .jbtns{display:flex;gap:8px}
  .jb{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line2);background:#0b1119;color:var(--dim);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .jb.ok{border-color:rgba(248,113,113,.4);color:var(--dang)}
  .jb.no{border-color:rgba(74,222,128,.4);color:var(--ok)}
  .jb.re{border-color:rgba(251,191,36,.4);color:var(--warn)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--dim2);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style></head><body>
<div class="app">
  <div class="wohead">
    <div class="r1"><span class="badge">오늘 작업</span><span id="conn" class="conn off">연결 확인 중…</span></div>
    <h1 id="woTitle">작업 불러오는 중…</h1>
    <div class="meta" id="woMeta"></div>
  </div>
  <div class="steps" id="steps"></div>
  <div class="feed" id="feed">
    <div class="hint">🔧 <b>작업 중 궁금한 것을 묻거나</b>, 사각지대는 <b>로봇에게 촬영을 맡기세요.</b><br>
      아래에서 말하거나(🎙️) 입력하면 절차·과거 사례·주의사항을 바로 찾아드립니다.<br>
      <span style="color:var(--dim2)">예: "동체 외판 부식 어떻게 검사해?" · "여기 찍어줘"</span></div>
  </div>
  <div class="quick" id="quick"></div>
  <div class="inbar">
    <button class="mic" id="mic" onclick="startVoice()" title="음성으로 질문">🎙️</button>
    <input class="qin" id="q" placeholder="질문하거나 '여기 찍어줘'라고 말하세요" onkeydown="if(event.key==='Enter')ask()">
    <button class="send" onclick="ask()">➤</button>
  </div>
</div>

<!-- 로봇 촬영 팝업 -->
<div class="modal" id="modal">
  <div class="sheet">
    <div class="sh">🤖 <b>로봇 촬영</b> <span style="font-size:11px;color:var(--dim);font-weight:400" id="modalLoc"></span><span class="x" onclick="closeModal()">✕</span></div>
    <div class="cam">
      <div class="lbl"><span class="rec"></span>CAM-01 · 사각지대</div>
      <img src="assets/corrosion_al.jpg" alt="검사 영상">
      <div class="ov"></div><div class="scan"></div>
      <div class="bb" style="top:30%;left:26%;width:44%;height:50%"><span class="bbt" style="top:-18px;left:-2px" id="bbt">CORROSION</span></div>
    </div>
    <div class="sbody" id="modalBody"></div>
  </div>
</div>

<script>
const KOR={DAMAGED:'손상',CORRODED:'부식',CRACKED:'균열',DENTED:'찍힘',GOUGED:'긁힘',PUNCTURED:'천공',WORN:'마모',DELAMINATED:'박리',BROKEN:'파손',MISSING:'누락','GROUND DAMAGE':'지상손상'};
const COLOR={DAMAGED:'var(--dmg)',CORRODED:'var(--corr)',CRACKED:'var(--crack)'};
let WO=null;

async function boot(){
  // 연결 + 오늘 작업
  try{
    const r=await fetch('/api/workflow');const j=await r.json();
    document.getElementById('conn').className='conn on';
    document.getElementById('conn').textContent='● 연결됨';
    WO=j.wo;
    if(WO){
      document.getElementById('woTitle').textContent=WO.purpose||'사각지대 외관검사';
      document.getElementById('woMeta').innerHTML=
        '<span>기체 <b>'+(WO.aircraft||'-')+'</b></span>'+
        '<span>부위 <b>'+(WO.partName||'SKIN')+' · '+(WO.loc||'FR73/STR29L')+'</b></span>'+
        '<span>계통 <b>'+(WO.sysCode||'5330')+'</b></span>';
      renderSteps(WO.steps||[]);
    }
  }catch(e){
    document.getElementById('conn').className='conn off';
    document.getElementById('conn').textContent='✗ 서버 미연결';
  }
  // 빠른 질문 칩
  document.getElementById('quick').innerHTML=
    ['동체 외판 부식 검사','스트링거','여기 찍어줘','좌석 레일']
    .map(t=>`<div class="qk" onclick="preset('${t}')">${t.includes('찍')?'🤖 ':'💬 '}${t}</div>`).join('');
}
function renderSteps(steps){
  const names=['안전조치','로봇 촬영','정비사 판정','기록·승인'];
  const el=document.getElementById('steps');
  const list=steps.length?steps:names.map((n,i)=>({seq:i+1,name:n,status:i<1?'DONE':''}));
  const doneN=list.filter(s=>s.status==='DONE').length;
  el.innerHTML=list.map((s,i)=>{
    const cls=s.status==='DONE'?'done':(i===doneN?'now':'');
    const ic=s.status==='DONE'?'✓':(i+1);
    return '<div class="stp '+cls+'"><span class="dot">'+ic+'</span>'+(s.name||names[i]||('단계'+(i+1)))+'</div>'+
      (i<list.length-1?'<span class="arw">›</span>':'');
  }).join('');
}

// ── 음성 ──
let recog=null,recActive=false;
function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const mic=document.getElementById('mic');
  if(!SR){addQ('(음성 미지원 — Chrome/Edge에서 사용하거나 텍스트 입력)');return;}
  if(recActive){recog&&recog.stop();return;}
  recog=new SR();recog.lang='ko-KR';recog.interimResults=true;
  recActive=true;mic.classList.add('rec');
  document.getElementById('q').placeholder='🎙️ 듣고 있어요…';
  recog.onresult=function(ev){
    let t='';for(let i=ev.resultIndex;i<ev.results.length;i++)t+=ev.results[i][0].transcript;
    document.getElementById('q').value=t;
    if(ev.results[ev.results.length-1].isFinal){recog.stop();setTimeout(ask,200);}
  };
  recog.onerror=function(){recActive=false;mic.classList.remove('rec');};
  recog.onend=function(){recActive=false;mic.classList.remove('rec');document.getElementById('q').placeholder="질문하거나 '여기 찍어줘'라고 말하세요";};
  recog.start();
}
function preset(t){document.getElementById('q').value=t;ask();}

// ── 질문 처리 ──
function addQ(text){
  const f=document.getElementById('feed');
  const h=f.querySelector('.hint'); if(h)h.remove();
  const b=document.createElement('div');b.className='qbub';b.textContent=text;f.appendChild(b);
  f.scrollTop=f.scrollHeight;
}
function addAns(html){
  const f=document.getElementById('feed');
  const d=document.createElement('div');d.className='ans';d.innerHTML=html;f.appendChild(d);
  d.querySelectorAll('.track div').forEach(b=>setTimeout(()=>b.style.width=b.dataset.w+'%',50));
  f.scrollTop=f.scrollHeight;
}
async function ask(){
  const inp=document.getElementById('q');const term=inp.value.trim();if(!term)return;
  inp.value='';
  addQ(term);
  // "찍어줘/촬영" 감지 → 로봇 팝업
  if(/찍어|촬영|찍자|찍어줘|스캔|카메라/.test(term)){ openRobot(term); return; }
  addAns('<div style="color:var(--dim2);font-size:12px;padding:4px 2px"><span class="spin"></span> 지식그래프 조회 중…</div>');
  try{
    const r=await fetch('/api/query?q='+encodeURIComponent(term));const j=await r.json();
    document.getElementById('feed').lastChild.remove();
    if(!j.found||!j.data){ addAns('<div class="card"><p style="color:var(--dim);font-size:12.5px">"'+term+'"에 해당하는 부품을 찾지 못했어요. <span style="color:var(--dim2)">현재 범위: 동체구조(외판·스트링거·프레임·좌석레일·플로어빔)</span></p></div>'); return; }
    renderAnswer(term,j);
  }catch(e){ document.getElementById('feed').lastChild.remove(); addAns('<div class="card"><p style="color:var(--dang);font-size:12px">조회 실패: '+e.message+'</p></div>'); }
}
function renderAnswer(term,j){
  const d=j.data,total=d.total||0;
  const defs=(d.defects||[]).filter(x=>x.name);
  const cases=(d.cases||[]).filter(c=>c.sum);
  const procs=j.procedures||[];
  const bars=defs.slice(0,5).map(x=>{const pct=total?Math.round(x.weight*100/total):0;const col=COLOR[x.name]||'var(--dim)';
    return '<div class="defect"><div class="dl"><b>'+(KOR[x.name]||x.name)+'</b><span>'+x.weight+'건 · '+pct+'%</span></div><div class="track"><div data-w="'+pct+'" style="width:0;background:'+col+'"></div></div></div>';}).join('');
  const ev=cases.slice(0,2).map(c=>'<div class="ev"><div class="eh"><span class="ac">'+(KOR[c.cond]||c.cond)+' 과거 사례</span><span class="loc">'+(c.fs?'FR'+c.fs:'')+(c.str?' / STR'+c.str:'')+'</span></div><div class="txt">"'+(c.sum||'').slice(0,120)+'…"</div><div class="src">📄 FAA SDR · '+(c.ac||'-')+'</div></div>').join('');
  const pr=procs.slice(0,2).map(p=>{
    const st=(p.steps||[]).map((s,i)=>'<span class="chip">'+(i+1)+'. '+s+'</span>').join('');
    const tl=(p.tools||[]).map(t=>'<span class="tool">🔧 '+t+'</span>').join('');
    const wn=(p.warnings||[]).filter(w=>w.text).slice(0,2).map(w=>'<div class="warn"><b>'+w.type+'</b> '+w.text+'</div>').join('');
    return '<div class="proc"><div class="pt">'+p.procedure+'</div>'+(st?'<div class="psteps">'+st+'</div>':'')+(tl?'<div class="psteps">'+tl+'</div>':'')+wn+'<div class="psrc">📘 '+(p.source||'FAA 핸드북')+' · '+(p.page||'')+'</div></div>';
  }).join('');
  let html='';
  if(bars) html+='<div class="card"><h3>📊 '+j.part+' 반복 결함 <span style="margin-left:auto;color:var(--dim2);font-weight:400;text-transform:none">총 '+total+'건</span></h3>'+bars+'</div>';
  if(ev) html+='<div class="card"><h3>📍 과거 사례 (근거)</h3>'+ev+'</div>';
  if(pr) html+='<div class="card"><h3>🛠 검사 절차·공구·주의사항 <span style="margin-left:auto;color:var(--dim2);font-weight:400;text-transform:none">FAA 핸드북</span></h3>'+pr+'</div>';
  // 로봇 촬영 제안
  html+='<div class="robotcta" onclick="openRobot(\'로봇 촬영\')"><span class="ic">🤖</span><div class="t"><b>사각지대는 로봇에게 맡기세요</b><p>'+(WO?(WO.partName||'SKIN')+' · '+(WO.loc||'FR73/STR29L'):'외판 내측')+' 촬영</p></div><span class="go">촬영 ›</span></div>';
  addAns(html);
}

// ── 로봇 팝업 ──
async function openRobot(term){
  addQ(term);
  const m=document.getElementById('modal');m.classList.add('show');
  const body=document.getElementById('modalBody');
  document.getElementById('modalLoc').textContent=WO?(WO.loc||'FR73 / STR29L'):'FR73 / STR29L';
  body.innerHTML='<div style="text-align:center;color:var(--dim2);font-size:12px;padding:14px"><span class="spin"></span> 로봇 이동·촬영 중…</div>';
  let sc={};
  try{const r=await fetch('/api/robot');const j=await r.json();sc=j.scene||{};}catch(e){}
  const conf=sc.candConf!=null?sc.candConf:0.87;
  const quality=sc.quality!=null?sc.quality:0.92;
  document.getElementById('bbt').textContent='CORROSION '+conf;
  setTimeout(()=>{
    body.innerHTML=
      '<div class="rst"><div class="b">🟠</div><div class="i"><div class="t">CORROSION 부식 후보</div><div class="s">'+(WO?(WO.loc||'FR73/STR29L'):'FR73/STR29L')+' · 품질 '+quality+' ✓</div></div><div class="c"><b>'+conf+'</b><span>신뢰도</span></div></div>'+
      '<div class="note">⚠️ AI·로봇은 <b>결함후보</b>까지만 표시합니다. 최종 판정은 <b>정비사</b>가 합니다.</div>'+
      '<div class="jbtns"><button class="jb ok" onclick="judge(\'이상\')">⚠ 이상</button><button class="jb no" onclick="judge(\'정상\')">✓ 정상</button><button class="jb re" onclick="judge(\'재검사\')">↺ 재검사</button></div>';
  },1400);
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function judge(v){
  closeModal();
  const col=v==='이상'?'var(--dang)':(v==='정상'?'var(--ok)':'var(--warn)');
  addAns('<div class="card"><h3>🤖 로봇 촬영 결과</h3>'+
    '<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span style="color:var(--dim)">검사 위치</span><b>'+(WO?(WO.loc||'FR73/STR29L'):'FR73/STR29L')+'</b></div>'+
    '<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span style="color:var(--dim)">AI 후보</span><b>부식 0.87</b></div>'+
    '<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span style="color:var(--dim)">정비사 판정</span><b style="color:'+col+'">'+v+'</b></div>'+
    '<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span style="color:var(--dim)">Work Card</span><b style="color:var(--ok)">자동 기록됨 ✓</b></div>'+
    (v==='이상'?'<p style="font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.5">→ 다음 조치: 부식 제거·처리 절차로 연계. 승인 시 검증사례로 지식에 축적됩니다.</p>':'')+
    '</div>');
}
boot();
</script>
</body></html>
